      function checkResult() {
        const input = document.getElementById("nisn-input").value.trim();
        const errorMsg = document.getElementById("error-msg");
        const resultArea = document.getElementById("result-area");

        errorMsg.classList.add("hidden");
        resultArea.classList.add("hidden");

        if (!input || input.length < 10) {
          errorMsg.textContent = "NISN harus 10 digit angka.";
          errorMsg.classList.remove("hidden");
          return;
        }

        const student = students.find((s) => s.nisn === input);

        if (!student) {
          errorMsg.textContent = "NISN tidak ditemukan dalam database.";
          errorMsg.classList.remove("hidden");
          return;
        }

        const isLulus = student.status === "lulus";
        const jkText = student.jk === "L" ? "Laki-laki" : "Perempuan";
        resultArea.innerHTML = `
        <div class="relative fade-up rounded-2xl p-6 text-center shadow-lg border-2 ${
          isLulus
            ? "bg-white/80 border-emerald-300 backdrop-blur-sm"
            : "bg-white/80 border-red-300 backdrop-blur-sm"
        }">
          ${isLulus ? '<div id="confetti-container"></div>' : ""}
          <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-gradient-to-br from-emerald-500 to-teal-600 mb-4 overflow-hidden">
            <img id="student-logo-img" src="https://i.ibb.co.com/0RjpWT3s/Whats-App-Image-2026-05-29-at-09-13-59.jpg" alt="Logo" class="w-full h-full object-cover"> <i data-lucide="user" class="w-10 h-10 text-gray-500" style="display: none;"></i>
          </div>
          <div class="inline-flex items-center justify-center w-14 h-14 rounded-full ${
            isLulus ? "bg-emerald-500" : "bg-red-500"
          } mb-3">
            <i data-lucide="${
              isLulus ? "check-circle" : "x-circle"
            }" class="w-7 h-7 text-white"></i>
          </div>
          <p class="text-xs uppercase tracking-widest ${
            isLulus ? "text-emerald-600" : "text-red-600"
          } font-semibold mb-1">Hasil Kelulusan</p>
          <h2 class="text-xl font-bold text-gray-800 mb-1">${student.nama}</h2>
          <div class="text-xs text-gray-500 mb-3 space-y-1">
            <p>NISN: ${student.nisn}</p>
            <p>Jenis Kelamin: ${jkText}</p>
            <p>Kelas: ${student.kelas}</p>
          </div>
          <div class="inline-block px-5 py-2 rounded-full font-bold text-lg ${
            isLulus ? "bg-emerald-500 text-white" : "bg-red-500 text-white"
          }">
            ${isLulus ? "🎉 LULUS" : "❌ TIDAK LULUS"}
          </div>
          ${
            isLulus
              ? '<p class="mt-3 text-sm text-emerald-700">Selamat! Anda dinyatakan lulus.</p>'
              : '<p class="mt-3 text-sm text-red-700">Mohon maaf, Anda dinyatakan belum lulus.</p>'
          }
        </div>
        ${
          isLulus
            ? `
        <div class="mt-5 fade-up bg-white/50 backdrop-blur-sm rounded-2xl shadow-lg p-6 border border-emerald-100">
          <p class="text-xs uppercase tracking-widest text-emerald-600 font-semibold mb-3 text-center">Pesan dari Kepala Sekolah</p>
          <div class="text-sm text-gray-700 leading-relaxed space-y-3 mb-5 text-center">
            <p><strong>Assalamu'alaikum Wr. Wb.</strong></p>
            <p class="italic">"Puji syukur kepada Allah SWT atas keberhasilan Anda mencapai tahap ini. Perjalanan pendidikan Anda telah menunjukkan dedikasi dan kerja keras yang luar biasa."</p>
            <p>"Sebagai Kepala Sekolah, saya berharap kalian terus mengedepankan nilai-nilai: <strong>Takwa, Cerdas, dan Terampil</strong>. Semoga kalian menjadi generasi yang takwa kepada Allah SWT, cerdas dalam berpikir dan bertindak, serta terampil dalam menghadapi tantangan masa depan. Terus bersemangat dan berbakti untuk kebaikan."</p>
            <p><strong>Wassalamu'alaikum Wr. Wb.</strong></p>
          </div>
          <div class="border-t pt-4 text-center">
            <p class="text-xs text-gray-600 mb-1">Kepala Sekolah</p>
            <p class="font-semibold text-sm text-gray-800">Sri Winarti, S. Pd.</p>
          </div>
        </div>
        `
            : ""
        }
      `;
        resultArea.classList.remove("hidden");
        lucide.createIcons();

        if (isLulus) {
    spawnConfetti();

    const music = document.getElementById("bgMusic");
    music.play();
}
      function spawnConfetti() {
        const container = document.getElementById("confetti-container");
        if (!container) return;
        const colors = ["#10b981", "#3b82f6", "#f59e0b", "#ec4899", "#8b5cf6"];
        for (let i = 0; i < 20; i++) {
          const piece = document.createElement("div");
          piece.className = "confetti-piece";
          piece.style.left = Math.random() * 100 + "%";
          piece.style.top = Math.random() * -20 + "px";
          piece.style.background =
            colors[Math.floor(Math.random() * colors.length)];
          piece.style.animationDelay = Math.random() * 0.5 + "s";
          container.appendChild(piece);
        }
      }

      // Enter key support
      document.getElementById("nisn-input").addEventListener("keydown", (e) => {
        if (e.key === "Enter") checkResult();
      });

        text_color: "#1f2937",
        accent_color: "#059669",
        secondary_action_color: "#6b7280",
        font_family: "Poppins",
        font_size: 16,
      };

      window.elementSdk.init({
        defaultConfig: {
          ...defaultConfig,
          foundation_name: "Jami Al Falah Haji Masjchun Sofwan",
          logo_url:
            "https://i.ibb.co.com/pjMvVCrs/Whats-App-Image-2026-05-29-at-09-14-00.jpg",
        },
        onConfigChange: async (config) => {
          document.getElementById("page-title").textContent =
            config.page_title || defaultConfig.page_title;
          document.getElementById("school-name").textContent =
            config.school_name || defaultConfig.school_name;
          document.getElementById("foundation-name").textContent =
            config.foundation_name || "Jami Al Falah Haji Masjchun Sofwan";

          // Update logo
          const logoUrl = config.logo_url;
          const logoImg = document.getElementById("logo-img");
          const logoIcon = document.getElementById("logo-icon");
          if (logoUrl && logoUrl.trim()) {
            logoImg.src = logoUrl;
            logoImg.style.display = "block";
            logoIcon.style.display = "none";
            logoImg.onerror = () => {
              logoImg.style.display = "none";
              logoIcon.style.display = "block";
            };
          } else {
            logoImg.style.display = "none";
            logoIcon.style.display = "block";
          }

          const font = config.font_family || defaultConfig.font_family;
          const size = config.font_size || defaultConfig.font_size;
          document.body.style.fontFamily = `${font}, Poppins, sans-serif`;
          document.getElementById("page-title").style.fontSize = `${
            size * 1.5
          }px`;
          document.getElementById("school-name").style.fontSize = `${
            size * 0.85
          }px`;

          document.body.style.color =
            config.text_color || defaultConfig.text_color;
        },
        mapToCapabilities: (config) => ({
          recolorables: [
            {
              get: () => config.primary_color || defaultConfig.primary_color,
              set: (v) => {
                config.primary_color = v;
                window.elementSdk.setConfig({ primary_color: v });
              },
            },
            {
              get: () => config.surface_color || defaultConfig.surface_color,
              set: (v) => {
                config.surface_color = v;
                window.elementSdk.setConfig({ surface_color: v });
              },
            },
            {
              get: () => config.text_color || defaultConfig.text_color,
              set: (v) => {
                config.text_color = v;
                window.elementSdk.setConfig({ text_color: v });
              },
            },
            {
              get: () => config.accent_color || defaultConfig.accent_color,
              set: (v) => {
                config.accent_color = v;
                window.elementSdk.setConfig({ accent_color: v });
              },
            },
            {
              get: () =>
                config.secondary_action_color ||
                defaultConfig.secondary_action_color,
              set: (v) => {
                config.secondary_action_color = v;
                window.elementSdk.setConfig({ secondary_action_color: v });
              },
            },
          ],
          borderables: [],
          fontEditable: {
            get: () => config.font_family || defaultConfig.font_family,
            set: (v) => {
              config.font_family = v;
              window.elementSdk.setConfig({ font_family: v });
            },
          },
          fontSizeable: {
            get: () => config.font_size || defaultConfig.font_size,
            set: (v) => {
              config.font_size = v;
              window.elementSdk.setConfig({ font_size: v });
            },
          },
        }),
        mapToEditPanelValues: (config) =>
          new Map([
            ["page_title", config.page_title || defaultConfig.page_title],
            ["school_name", config.school_name || defaultConfig.school_name],
            [
              "foundation_name",
              config.foundation_name || "Jami Al Falah Haji Masjchun Sofwan",
            ],
            [
              "logo_url",
              config.logo_url ||
                "https://i.ibb.co.com/pjMvVCrs/Whats-App-Image-2026-05-29-at-09-14-00.jpg",
            ],
          ]),
      });

      lucide.createIcons();
    </script>
